name: KAAO Android CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Test, Lint & Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log; then
            ERR=$(grep -E "^(e: |FAILURE:|> |Caused by:|.*FAILED)" /tmp/test.log | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=testDebugUnitTest failed::$ERR"
            exit 1
          fi

      - name: Run Android Lint
        run: |
          set -o pipefail
          if ! ./gradlew lintDebug --stacktrace 2>&1 | tee /tmp/lint.log; then
            ERR=$(grep -E "(Error:|FAILURE:|> |lint-results)" /tmp/lint.log | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=lintDebug failed::$ERR"
            exit 1
          fi

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/assemble.log; then
            ERR=$(grep -E "^(e: |FAILURE:|> |Caused by:)" /tmp/assemble.log | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=assembleDebug failed::$ERR"
            exit 1
          fi

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaao-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
